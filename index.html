<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sticky Notes Board</h1>
            <button id="addNoteBtn" class="add-btn">+ Add Note</button>
        </header>
        
        <div class="notes-container" id="notesContainer">
            <!-- Notes will be dynamically added here -->
        </div>
        
        <!-- Color Picker Modal -->
        <div id="colorModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Choose Note Color</h3>
                <div class="color-options">
                    <div class="color-option" data-color="#ffd700" style="background-color: #ffd700;"></div>
                    <div class="color-option" data-color="#ff6b6b" style="background-color: #ff6b6b;"></div>
                    <div class="color-option" data-color="#4ecdc4" style="background-color: #4ecdc4;"></div>
                    <div class="color-option" data-color="#45b7d1" style="background-color: #45b7d1;"></div>
                    <div class="color-option" data-color="#96ceb4" style="background-color: #96ceb4;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
